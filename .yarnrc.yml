# ------------------------------------------------------------------------------
# Core Installation Settings
# ------------------------------------------------------------------------------

# Use node-modules linker for compatibility with the ecosystem
nodeLinker: node-modules

# Share cached packages across local projects for efficient storage
enableGlobalCache: true

# Use mixed compression (gzip level 9, but store uncompressed when gzip
# overhead exceeds the size gain)
compressionLevel: mixed

# ------------------------------------------------------------------------------
# Security: Lockfile & Install Integrity
# ------------------------------------------------------------------------------

# Prevent modifications to the lockfile during install.
enableImmutableInstalls: true

# Throw an error when a cached package checksum does not match the lockfile.
checksumBehavior: throw

# Validate every lockfile resolution against the remote registry at install time.
enableHardenedMode: true

# ------------------------------------------------------------------------------
# Security: Network & Registry
# ------------------------------------------------------------------------------

# Explicit registry URL
npmRegistryServer: "https://registry.yarnpkg.com"

# Enforce strict SSL certificate validation for every registry connection.
enableStrictSsl: true

# Reduce the likelihood of installing compromised packages,
npmMinimalAgeGate: "7d"

# ------------------------------------------------------------------------------
# Security: Script Execution
# ------------------------------------------------------------------------------

# Disable lifecycle scripts (postinstall, preinstall, etc.) from third-party
# packages by default. Postinstall scripts are a primary vector for supply-chain
# attacks.
#
# Allow required packages that rely on lifecycle/build steps to run them
# explicitly. `puppeteer` typically needs its postinstall step to provision the
# browser used by e2e tests.
dependenciesMeta:
  puppeteer:
    built: true
enableScripts: false

# ------------------------------------------------------------------------------
# Privacy
# ------------------------------------------------------------------------------

# Disable anonymous telemetry sent to Yarn servers.
enableTelemetry: false
